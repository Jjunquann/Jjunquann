# README cards, see https://github.com/pedrocatalao/github-cool-readme (MIT)
name: Update README cards
on:
  schedule: [{cron: '17 */6 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pedrocatalao/github-cool-readme@v1
        with:
          token: ${{ secrets.CARDS_TOKEN }}
          output: ${{ runner.temp }}/cards
      - name: Publish the cards on the cards branch
        run: |
          if ! ls "$RUNNER_TEMP"/cards/*.svg >/dev/null 2>&1; then echo "No cards"; exit 0; fi
          git fetch --quiet --depth 1 origin cards:refs/remotes/origin/cards 2>/dev/null || true
          git switch --quiet --orphan cards
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add -- *.svg
          git config user.name 'Bryan'
          git config user.email '203243752+Jjunquann@users.noreply.github.com'
          git commit --quiet -m 'Update README cards'
          if git rev-parse --quiet --verify origin/cards >/dev/null && git diff --quiet origin/cards HEAD; then echo "No changes"; exit 0; fi
          git push --force origin cards
